name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o parse .

      - name: Attach to release
        run: |
          gh release upload "${{ github.ref_name }}" parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
